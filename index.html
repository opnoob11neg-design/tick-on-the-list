  button.opt, button.next {
    text-align: left; background: transparent; color: var(--fg); border: 1px solid var(--line);

  button.next { margin-top: 24px; text-align: center; }

  .result.show { opacity: 1; }
  .slot {
    position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--slot);
    border: 1px dashed #3a3936; margin: 0 0 28px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; color: var(--muted); font-family: system-ui, sans-serif; font-size: 12px; text-align: center; padding: 12px;
  }
  .slot img, .slot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(.6) contrast(1.1); }
  .slot.filled { border: none; }
  .cap { color: var(--muted); font-family: system-ui, sans-serif; font-size: 12px; line-height: 1.5; margin: 0 0 28px; }
  .slot .tag { color: var(--accent); letter-spacing: .15em; display: block; margin-bottom: 4px; }
  form.q { display: flex; flex-direction: column; gap: 26px; margin-top: 12px; }
  .q label.qt { display: block; margin-bottom: 10px; font-size: 17px; }
  .scale { display: flex; gap: 8px; flex-wrap: wrap; }
  .scale input { display: none; }
  .scale span {
    display: inline-block; min-width: 46px; text-align: center; padding: 8px 0; border: 1px solid var(--line);
    cursor: pointer; border-radius: 3px; font-family: system-ui, sans-serif;
  }
  .scale input:checked + span { border-color: var(--accent); color: #fff; background: #241311; }
  .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-family: system-ui, sans-serif; margin-top: 4px; max-width: 290px; }
  textarea {
    width: 100%; min-height: 96px; background: #111; color: var(--fg); border: 1px solid var(--line);
    font: inherit; font-size: 16px; padding: 10px; border-radius: 3px;

  .err { color: #e07a6f; font-family: system-ui, sans-serif; font-size: 14px; min-height: 1em; }
  .refs { font-family: system-ui, sans-serif; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .refs li { margin-bottom: 6px; }
  .flash { animation: flash 1.2s ease; }
  @keyframes flash { 0% { background: #3a0f0b; } 100% { background: var(--bg); } }
  .count { font-size: clamp(56px, 18vw, 120px); color: var(--accent); line-height: 1; margin: 12px 0 6px; font-family: system-ui, sans-serif; }
  @media (max-width: 480px) {

const REFS = [

  "Radio Free Asia. (2020, July 21). Nike says China-based supplier sent all Uyghur workers home amid forced labor allegations.",

/* ===== 聲音（全部用程式合成，沒有外部音檔） ===== */
const Sound = (() => {
  let ctx = null, master = null, current = null, muted = false;
  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
  }
  function noiseBuffer() {
    const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function stop() {
    if (!current) return;
    const c = current; current = null;
    try { c.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.4); } catch (e) {}
    setTimeout(() => { c.nodes.forEach(n => { try { n.stop ? n.stop() : null; } catch (e) {} }); c.timers.forEach(clearInterval); }, 1500);
  }
  function play(kind) {
    if (!ctx) return;
    stop();
    const g = ctx.createGain(); g.gain.value = 0; g.connect(master);
    g.gain.setTargetAtTime(1, ctx.currentTime, 0.8);
    const nodes = [], timers = [];
    // 底下一直有一個低頻嗡聲
    const drone = ctx.createOscillator(); drone.type = "sine"; drone.frequency.value = 55;
    const dg = ctx.createGain(); dg.gain.value = kind === "wind" ? 0.05 : 0.12;
    drone.connect(dg).connect(g); drone.start(); nodes.push(drone);
    const drone2 = ctx.createOscillator(); drone2.type = "sine"; drone2.frequency.value = 82.4;
    const dg2 = ctx.createGain(); dg2.gain.value = 0.05; drone2.connect(dg2).connect(g); drone2.start(); nodes.push(drone2);
    if (kind === "wind") {
      const n = ctx.createBufferSource(); n.buffer = noiseBuffer(); n.loop = true;
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 500; f.Q.value = 0.7;
      const ng = ctx.createGain(); ng.gain.value = 0.18;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.12; const lg = ctx.createGain(); lg.gain.value = 300;
      lfo.connect(lg).connect(f.frequency); lfo.start(); nodes.push(lfo);
      n.connect(f).connect(ng).connect(g); n.start(); nodes.push(n);
    }
    if (kind === "train") {
      const buf = noiseBuffer();
      let beat = 0;
      timers.push(setInterval(() => {
        const s = ctx.createBufferSource(); s.buffer = buf;
        const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 180;
        const e = ctx.createGain(); const t = ctx.currentTime;
        e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(0.7, t + 0.01); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
        s.connect(f).connect(e).connect(g); s.start(t); s.stop(t + 0.3);
        beat++;
      }, 330));
      timers.push(setInterval(() => {}, 1000));
    }
    if (kind === "sewing") {
      const buf = noiseBuffer();
      timers.push(setInterval(() => {
        const t = ctx.currentTime;
        for (let i = 0; i < 6; i++) {
          const s = ctx.createBufferSource(); s.buffer = buf;
          const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 2500;
          const e = ctx.createGain(); const ti = t + i * 0.07;
          e.gain.setValueAtTime(0.0001, ti); e.gain.exponentialRampToValueAtTime(0.25, ti + 0.004); e.gain.exponentialRampToValueAtTime(0.0001, ti + 0.04);
          s.connect(f).connect(e).connect(g); s.start(ti); s.stop(ti + 0.05);
        }
      }, 900));
    }
    current = { gain: g, nodes, timers };
  }
  function hit() {
    if (!ctx || muted) return;
    const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = 41;
    const e = ctx.createGain(); const t = ctx.currentTime;
    e.gain.setValueAtTime(0.9, t); e.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o.connect(e).connect(master); o.start(t); o.stop(t + 1.7);
  }
  function toggle() {
    muted = !muted;
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.5, ctx.currentTime, 0.1);
    return muted;
  }
  return { init, play, stop, hit, toggle };
})();

/* ===== 狀態 ===== */
let lang = "zh";
const state = { age: null, pre1: null, pre2: null, post1: null, post2: null, open: "", choices: [] };
let screen = "title", sceneIdx = 0;

const app = document.getElementById("app");
const L = () => T[lang];
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.textContent = html; return e; };

function reveal(nodes, step = 700) {
  nodes.forEach((n, i) => setTimeout(() => n.classList.add("show"), 150 + i * step));
  return 150 + nodes.length * step;
}

function mediaSlot(key) {
  if (!key) return document.createDocumentFragment();
  const m = MEDIA[key]; const box = el("div", "slot");
  if (m && m.src) {
    box.classList.add("filled");
    const media = m.type === "video" ? Object.assign(document.createElement("video"), { src: m.src, autoplay: true, muted: true, loop: true, playsInline: true }) : Object.assign(document.createElement("img"), { src: m.src, alt: "" });
    box.appendChild(media);
    const capText = m.cap && m.cap[lang];
    if (capText) {
      const wrap = document.createDocumentFragment();
      box.style.marginBottom = "8px";
      wrap.appendChild(box);
      wrap.appendChild(el("div", "cap", capText));
      return wrap;
    }
  } else {
    const t = el("span", "tag", "素材位 / MEDIA SLOT"); box.appendChild(t);
    box.appendChild(document.createTextNode(m ? m.hint : ""));
  }
  return box;
}

function render() {
  window.scrollTo(0, 0);
  app.innerHTML = "";
  document.getElementById("lang").textContent = L().langBtn;
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  ({ title: renderTitle, age: renderAge, pre: renderPre, scene: renderScene, end: renderEnd, post: renderPost, done: renderDone })[screen]();
}

function renderTitle() {
  app.appendChild(el("h1", null, L().title));
  app.appendChild(el("p", "sub", L().sub));
  const ps = L().intro.map(t => { const p = el("p", "para", t); app.appendChild(p); return p; });
  const b = el("button", "next", L().start);
  b.onclick = () => { Sound.init(); Sound.play("wind"); screen = "age"; render(); };
  app.appendChild(b);
  reveal(ps, 400);
}

function scaleField(name, q, ends) {
  const wrap = el("div", "q");
  wrap.appendChild(el("label", "qt", q));
  const sc = el("div", "scale");
  for (let i = 1; i <= 5; i++) {
    const lab = document.createElement("label");
    const inp = Object.assign(document.createElement("input"), { type: "radio", name, value: i });
    if (state[name] == i) inp.checked = true;
    lab.appendChild(inp); lab.appendChild(el("span", null, String(i)));
    sc.appendChild(lab);
  }
  wrap.appendChild(sc);
  const e = el("div", "ends"); e.appendChild(el("span", null, ends[0])); e.appendChild(el("span", null, ends[1]));
  wrap.appendChild(e);
  return wrap;
}

function renderAge() {
  app.appendChild(el("p", "para show big", L().ageQ));
  const box = el("div", "choices show");
  L().ageOpts.forEach((t, i) => {
    const b = el("button", "opt", t);
    b.onclick = () => {
      state.age = i === 0 ? "under18" : "18plus";
      if (i === 0) {
        app.innerHTML = "";
        app.appendChild(el("p", "para show", L().underage));
        const n = el("button", "next", L().go); n.onclick = () => { screen = "scene"; sceneIdx = 0; render(); };
        app.appendChild(n);
      } else { screen = "pre"; render(); }
    };
    box.appendChild(b);
  });
  app.appendChild(box);
}

function renderPre() {
  app.appendChild(el("p", "para show big", L().preTitle));
  const f = el("form", "q");
  f.appendChild(scaleField("pre1", L().q1, L().q1ends));
  f.appendChild(scaleField("pre2", L().q2, L().q2ends));
  const err = el("div", "err"); f.appendChild(err);
  const b = el("button", "next", L().go); b.type = "submit"; f.appendChild(b);
  f.onsubmit = ev => {
    ev.preventDefault();
    const a = f.querySelector('input[name=pre1]:checked'), c = f.querySelector('input[name=pre2]:checked');
    if (!a || !c) { err.textContent = L().needAll; return; }
    state.pre1 = +a.value; state.pre2 = +c.value;
    screen = "scene"; sceneIdx = 0; render();
  };
  app.appendChild(f);
}

function renderScene() {
  const s = SCENES[sceneIdx]; const c = s[lang];
  Sound.play(s.sound);
  app.appendChild(el("div", "scene-no", L().sceneLabel(sceneIdx + 1)));
  app.appendChild(mediaSlot(s.media));
  const ps = c.text.map(t => { const p = el("p", "para", t); app.appendChild(p); return p; });
  const src = el("div", "src", c.src); app.appendChild(src);
  const box = el("div", "choices");
  const res = el("p", "result");
  const already = state.choices[sceneIdx];
  c.choices.forEach((t, i) => {
    const b = el("button", "opt", t);
    b.onclick = () => {
      state.choices[sceneIdx] = i;
      box.querySelectorAll("button").forEach(x => x.disabled = true);
      b.classList.add("picked");
      res.textContent = c.results[i];
      setTimeout(() => res.classList.add("show"), 200);
      setTimeout(() => { nextBtn.style.visibility = "visible"; }, 1400);
    };
    box.appendChild(b);
  });
  app.appendChild(box); app.appendChild(res);
  const nextBtn = el("button", "next", L().cont); nextBtn.style.visibility = "hidden";
  nextBtn.onclick = () => {
    sceneIdx++;
    if (sceneIdx >= SCENES.length) { screen = "end"; }
    render();
  };
  app.appendChild(nextBtn);
  const t = reveal([...ps, src], 900);
  setTimeout(() => box.classList.add("show"), t);
  if (already != null) { // 切換語言時保留已選
    const b = box.querySelectorAll("button")[already];
    box.querySelectorAll("button").forEach(x => x.disabled = true);
    b.classList.add("picked"); res.textContent = c.results[already]; res.classList.add("show"); nextBtn.style.visibility = "visible";
  }
}

function renderEnd() {
  Sound.stop();
  document.body.classList.remove("flash"); void document.body.offsetWidth; document.body.classList.add("flash");
  Sound.hit();
  const n = state.choices.filter(x => x != null).length;
  const a = el("p", "para big", L().endA(n));
  const big = el("div", "count para", String(n));
  const b = el("p", "para big", L().endB);
  app.appendChild(big); app.appendChild(a); app.appendChild(b);
  app.appendChild(mediaSlot("shoes"));
  const ps = L().endC.map(t => { const p = el("p", "para", t); app.appendChild(p); return p; });
  const src = el("div", "src", L().endSrc); app.appendChild(src);
  const nx = el("button", "next", L().cont); nx.style.visibility = "hidden";
  nx.onclick = () => { screen = state.age === "18plus" ? "post" : "done"; render(); };
  app.appendChild(nx);
  const t = reveal([big, a, b, ...ps, src], 1100);
  setTimeout(() => nx.style.visibility = "visible", t);
}

function renderPost() {
  app.appendChild(el("p", "para show big", L().postTitle));
  const f = el("form", "q");
  f.appendChild(scaleField("post1", L().q1, L().q1ends));
  f.appendChild(scaleField("post2", L().q2, L().q2ends));
  const ow = el("div", "q"); ow.appendChild(el("label", "qt", L().openQ));
  const ta = document.createElement("textarea"); ta.value = state.open; ow.appendChild(ta); f.appendChild(ow);
  const err = el("div", "err"); f.appendChild(err);
  const b = el("button", "next", L().submit); b.type = "submit"; f.appendChild(b);
  f.onsubmit = async ev => {
    ev.preventDefault();
    const a = f.querySelector('input[name=post1]:checked'), c = f.querySelector('input[name=post2]:checked');
    if (!a || !c) { err.textContent = L().needAll; return; }
    state.post1 = +a.value; state.post2 = +c.value; state.open = ta.value.trim();
    b.disabled = true; b.textContent = L().sending;
    await send();
    screen = "done"; render();
  };
  app.appendChild(f);
}

let sentMode = "";
async function send() {
  const record = {
    age: state.age, pre1: state.pre1, pre2: state.pre2, post1: state.post1, post2: state.post2,
    open: state.open, choices: state.choices.map(x => x == null ? "-" : x + 1).join(""), lang
  };
  if (!CONFIG.formAction) {
    try { const k = "hra_game_test"; const arr = JSON.parse(localStorage.getItem(k) || "[]"); arr.push({ ...record, t: new Date().toISOString() }); localStorage.setItem(k, JSON.stringify(arr)); } catch (e) {}
    console.log("[test mode] record", record);
    sentMode = "test"; return;
  }
  const fd = new URLSearchParams();
  Object.entries(CONFIG.entries).forEach(([k, id]) => { if (id) fd.append(id, record[k] ?? ""); });
  try { await fetch(CONFIG.formAction, { method: "POST", mode: "no-cors", body: fd }); } catch (e) {}
  sentMode = "sent";
}

function renderDone() {
  Sound.stop();
  app.appendChild(el("p", "para show big", L().thanks));
  if (state.age !== "18plus") app.appendChild(el("p", "src show", L().noSend));
  else if (sentMode === "test") app.appendChild(el("p", "src show", L().testMode));
  app.appendChild(el("p", "para show", L().disclose));
  app.appendChild(el("p", "para show", L().refsTitle));
  const ul = el("ul", "refs"); REFS.forEach(r => ul.appendChild(el("li", null, r))); app.appendChild(ul);
  const b = el("button", "next", L().again);
  b.onclick = () => { Object.assign(state, { age: null, pre1: null, pre2: null, post1: null, post2: null, open: "", choices: [] }); sentMode = ""; screen = "title"; render(); };
  app.appendChild(b);
}

document.getElementById("lang").onclick = () => { lang = lang === "zh" ? "en" : "zh"; render(); };
document.getElementById("mute").onclick = e => { Sound.init(); e.target.textContent = Sound.toggle() ? "×" : "♪"; };
render();
</script>
